# Docker-Logs pro Container begrenzen (Default "json-file" waechst sonst
# unbegrenzt und kann die Festplatte fuellen): max. 5 x 10 MB je Dienst.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app-db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: pflegedb
      POSTGRES_USER: pl2
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set-in-.env}
    volumes:
      - app-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pl2 -d pflegedb"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  app:
    # IMAGE_TAG wird vom Deploy-Workflow auf den Commit-SHA gesetzt (reproduzierbar,
    # Rollback = alten Tag in .env eintragen). Lokal reicht der Default/build.
    image: ghcr.io/mbrx387/pl2-hfh/app:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    environment:
      APP_DB_HOST: app-db
      APP_DB_PORT: 5432
      APP_DB_NAME: pflegedb
      APP_DB_USER: pl2
    depends_on:
      app-db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "8000" # nur im internen Docker-Netzwerk erreichbar, nicht am Host
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Hostname dieses Servers (INT: projekthfh.tech, PROD: HFH-Domain).
      # Der Deploy schreibt ihn aus APP_PUBLIC_URL in die .env. Lokal ein
      # Platzhalter ("localhost" bedient das Template ohnehin immer mit).
      PUBLIC_HOST: ${PUBLIC_HOST:-pl2-hfh.localhost}
      # Das Image rendert nginx/templates/*.template beim Start mit envsubst.
      # Der Filter ersetzt nur ${PUBLIC_HOST}, nicht nginx-Variablen ($host ...).
      # "$$" ist das Compose-Escape fuer ein einzelnes "$".
      NGINX_ENVSUBST_FILTER: "^PUBLIC_HOST$$"
      # templates/sites/x.conf.template -> /etc/nginx/sites/x.conf
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # certbot (Webroot) schreibt die Challenge-Dateien auf dem Host nach
      # nginx/acme-challenge/, nginx liefert sie unter
      # /.well-known/acme-challenge/ aus (siehe nginx/README.md, certbot).
      - ./nginx/acme-challenge:/var/www/certbot:ro
    networks:
      - internal
    healthcheck:
      # Prueft den ganzen Weg: TLS-Handshake -> nginx -> App.
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Keycloak (SSO) + eigene Postgres-DB. Aktivieren mit:
  #   docker compose --profile sso up -d
  # Die App erzwingt den Login ueber dieses Keycloak (siehe app/auth.py);
  # Inbetriebnahme/Bootstrapping: README.md, Abschnitt 8.
  keycloak-db:
    image: postgres:16-alpine
    profiles: ["sso"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set-in-.env}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2-0
    # KC_COMMAND: "start" (Produktion, Default) oder "start-dev" (lokal).
    # --import-realm liest beim ERSTEN Start keycloak/realm-export.json ein
    # (Realm, Client, Rollen, Gruppen, Sicherheit); existiert der Realm schon,
    # wird uebersprungen -> dann keycloak/configure.sh verwenden.
    command: ${KC_COMMAND:-start} --import-realm
    profiles: ["sso"]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set-in-.env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set-in-.env}
      # TLS terminiert nginx; Keycloak spricht intern HTTP und vertraut den
      # X-Forwarded-*-Headern (ersetzt das veraltete KC_PROXY=edge).
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_RELATIVE_PATH: /idp
      # Oeffentliche Basis-URL INKLUSIVE /idp - Keycloak baut daraus alle
      # selbst generierten Links (Login-Formular, Discovery, iss-Claim).
      # Ohne Pfadanteil fehlt "/idp" in einigen Links.
      KC_HOSTNAME: ${KC_HOSTNAME:?set-in-.env}
      # Admin-Konsole NUR ueber den SSH-Tunnel (localhost:8080). Ohne diese
      # Option wuerde Keycloak wegen KC_HOSTNAME auch die Konsole auf die
      # oeffentliche Domain umleiten; nginx blockt /idp/admin/ zusaetzlich.
      KC_HOSTNAME_ADMIN: ${KC_HOSTNAME_ADMIN:-http://localhost:8080/idp}
      # Wird per ${...}-Platzhalter in keycloak/realm-export.json eingesetzt
      # (Redirect-/Logout-URIs des Clients).
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?set-in-.env}
      # Health-Endpunkte auf dem internen Management-Port 9000 (nicht nach
      # aussen veroeffentlicht), genutzt vom healthcheck unten.
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # Eigenes Login-Theme "hfh" (keycloak/themes/hfh). Aktivieren im Realm:
      # Realm settings -> Themes -> Login theme: hfh. Keycloak cached Themes
      # im Produktivmodus: nach Aenderungen am Theme Keycloak neu starten.
      - ./keycloak/themes/hfh:/opt/keycloak/themes/hfh:ro
    healthcheck:
      # Das Keycloak-Image enthaelt weder curl noch wget; daher eine rohe
      # HTTP-Anfrage ueber Bash /dev/tcp an den Management-Port.
      test:
        - "CMD-SHELL"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /idp/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    ports:
      # Nur an localhost gebunden: Admin-Konsole waehrend der Einrichtung per
      # SSH-Tunnel erreichbar (`ssh -L 8080:localhost:8080 user@server`),
      # aber NICHT direkt aus dem Internet. Regulaerer Zugriff laeuft ueber
      # nginx (https://<host>/idp/) - siehe nginx/templates/sites/default.conf.template.
      - "127.0.0.1:8080:8080"
    networks:
      - internal

volumes:
  app-db-data:
  keycloak-db-data:

networks:
  internal:
    driver: bridge
