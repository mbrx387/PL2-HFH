services:
  app:
    # IMAGE_TAG wird vom Deploy-Workflow auf den Commit-SHA gesetzt (reproduzierbar,
    # Rollback = alten Tag in .env eintragen). Lokal reicht der Default/build.
    image: ghcr.io/mbrx387/pl2-hfh/app:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "8000" # nur im internen Docker-Netzwerk erreichbar, nicht am Host
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - internal

  # Keycloak (SSO) + eigene Postgres-DB. Aktivieren mit:
  #   docker compose --profile sso up -d
  # Die App erzwingt den Login ueber dieses Keycloak (siehe app/auth.py);
  # Inbetriebnahme/Bootstrapping: docs/ROADMAP.md, Abschnitt 1.1.
  keycloak-db:
    image: postgres:16-alpine
    profiles: ["sso"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set-in-.env}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    # KC_COMMAND: "start" (Produktion, Default) oder "start-dev" (lokal).
    # --import-realm liest beim ERSTEN Start keycloak/realm-export.json ein
    # (Realm + Client + Demo-User); existiert der Realm schon, wird uebersprungen.
    command: ${KC_COMMAND:-start} --import-realm
    profiles: ["sso"]
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set-in-.env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set-in-.env}
      # TLS terminiert nginx; Keycloak spricht intern HTTP und vertraut den
      # X-Forwarded-*-Headern (ersetzt das veraltete KC_PROXY=edge).
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_RELATIVE_PATH: /idp
      # Oeffentliche Basis-URL INKLUSIVE /idp - Keycloak baut daraus alle
      # selbst generierten Links (Login-Formular, Discovery, iss-Claim).
      # Ohne Pfadanteil fehlt "/idp" in einigen Links.
      KC_HOSTNAME: ${KC_HOSTNAME:?set-in-.env}
      # Admin-Konsole NUR ueber den SSH-Tunnel (localhost:8080). Ohne diese
      # Option wuerde Keycloak wegen KC_HOSTNAME auch die Konsole auf die
      # oeffentliche Domain umleiten; nginx blockt /idp/admin/ zusaetzlich.
      KC_HOSTNAME_ADMIN: ${KC_HOSTNAME_ADMIN:-http://localhost:8080/idp}
      # Wird per ${...}-Platzhalter in keycloak/realm-export.json eingesetzt
      # (Redirect-/Logout-URIs des Clients).
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?set-in-.env}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      # Nur an localhost gebunden: Admin-Konsole waehrend der Einrichtung per
      # SSH-Tunnel erreichbar (`ssh -L 8080:localhost:8080 user@server`),
      # aber NICHT direkt aus dem Internet. Regulaerer Zugriff laeuft ueber
      # nginx (https://<host>/idp/) - siehe nginx/conf.d/default.conf.
      - "127.0.0.1:8080:8080"
    networks:
      - internal

volumes:
  keycloak-db-data:

networks:
  internal:
    driver: bridge
