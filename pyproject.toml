[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: Depends()/Query() als Default ist das FastAPI-Idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
# Dedicated disposable test directory; avoids locked Windows system temp folders.
addopts = "--basetemp=.pytest_tmp"
testpaths = ["tests", "GetDataFromAPI"]
# Repo-Root in sys.path, damit "import app" auch bei direktem `pytest`-Aufruf klappt.
pythonpath = ["."]
