# Reverse Proxy + TLS-Terminierung vor der FastAPI-App.
#
# Aufbau:
#   1. Port 80, bekannte Hosts: certbot-Challenge + Umleitung auf HTTPS
#   2. Port 80/443, unbekannte Hosts (Scanner, Aufruf per IP): abweisen
#   3. Port 443, www.projekthfh.tech: Umleitung auf projekthfh.tech
#   4. Port 443, projekthfh.tech + localhost: die eigentliche Anwendung
#
# Neuer Hostname (Domainwechsel): server_name in Block 1, 3 und 4 sowie die
# map $canonical_host in nginx.conf anpassen. "localhost" muss bleiben - der
# Deploy-Healthcheck und der Container-Healthcheck rufen https://localhost auf.

# --- TLS-Einstellungen (http-Ebene, gelten fuer alle 443-Server) ----------
# Server: Let's-Encrypt-Zertifikat, von certbot nach nginx/certs/ kopiert
# (scripts/certbot-deploy-hook.sh). Lokal: selbstsigniert
# (scripts/generate_dev_cert.sh). Details: nginx/README.md, Abschnitt certbot.
ssl_certificate     /etc/nginx/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/privkey.pem;
# Mozilla "intermediate"-Profil
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache   shared:SSL:10m;
ssl_session_tickets off;

# --- 1. HTTP (Port 80), bekannte Hosts --------------------------------------
server {
    listen 80;
    server_name projekthfh.tech www.projekthfh.tech localhost;

    include /etc/nginx/conf.d/security-headers.inc;

    # certbot (Webroot-Methode) legt hier kurzzeitig eine Datei ab, die
    # Let's Encrypt per HTTP abruft, um den Besitz der Domain zu pruefen.
    # Muss VOR der HTTPS-Umleitung beantwortet werden.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$canonical_host$request_uri;
    }
}

# --- 2. Unbekannte Hosts ------------------------------------------------------
# Antwortet nicht auf Anfragen an fremde Hostnamen oder die nackte IP.
# Port 80: Verbindung ohne Antwort schliessen (444). Port 443: TLS-Handshake
# ablehnen, damit das Zertifikat (und damit der Domainname) nicht verraten wird.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
    return 444;
}

# --- 3. HTTPS, www -> Hauptadresse -------------------------------------------
# Eine Adresse = ein Session-Cookie und eine Redirect-URI in Keycloak.
server {
    listen 443 ssl;
    http2 on;
    server_name www.projekthfh.tech;

    include /etc/nginx/conf.d/security-headers.inc;

    return 301 https://projekthfh.tech$request_uri;
}

# --- 4. HTTPS, Anwendung -----------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name projekthfh.tech localhost;

    include /etc/nginx/conf.d/security-headers.inc;

    limit_req zone=general burst=20 nodelay;

    # Docker-interner Resolver + $upstream-Variablen statt statischer
    # Hostnamen in proxy_pass: nginx loest Container-Namen sonst NUR EINMAL
    # beim eigenen Start/Reload auf und cached das Ergebnis dauerhaft - wird
    # z.B. nur der "app"-Container neu gebaut/neu gestartet (neue interne
    # IP), zeigt nginx ohne dieses Muster weiter auf die alte, tote IP
    # (502), bis nginx selbst manuell neu geladen wird. Mit der Variable
    # wird pro Request neu aufgeloest. Zusaetzlicher Vorteil bei /idp/:
    # ohne aktives "sso"-Profil existiert der Container "keycloak" gar
    # nicht - ein statischer Hostname wuerde dann schon den Config-Test
    # (und damit den gesamten Reverse Proxy) zum Scheitern bringen.
    resolver 127.0.0.11 valid=10s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        set $app_upstream app:8000;
        proxy_pass http://$app_upstream$request_uri;
    }

    # CSS/JS der App. Eigener, hoeherer Burst: Viele Nutzer hinter einer
    # gemeinsamen Hochschul-IP (NAT) teilen sich sonst das Limit schon beim
    # Seitenaufbau. Cache-Dauer haengt am ?v=-Parameter (siehe nginx.conf).
    location /static/ {
        limit_req zone=general burst=100 nodelay;
        set $app_upstream app:8000;
        proxy_pass http://$app_upstream$request_uri;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control $static_cache_control always;
    }

    location = /healthz {
        set $app_upstream app:8000;
        proxy_pass http://$app_upstream/healthz;
        access_log off;
    }

    # Keycloak (SSO), nur relevant wenn "docker compose --profile sso"
    # gestartet wurde. Ueber KC_HTTP_RELATIVE_PATH=/idp erwartet Keycloak
    # selbst Requests unter genau diesem Pfad-Praefix.
    #
    # Admin-Konsole + Admin-REST-API sind oeffentlich gesperrt; Zugriff nur
    # per SSH-Tunnel auf 127.0.0.1:8080 (siehe KC_HOSTNAME_ADMIN in
    # docker-compose.yml).
    location /idp/admin/ {
        return 404;
    }

    location /idp/ {
        set $keycloak_upstream keycloak:8080;
        # Login-Theme und Account-Konsole laden viele Assets auf einmal -
        # hoeherer Burst, sonst greift das Rate-Limit beim Seitenaufbau.
        limit_req zone=general burst=100 nodelay;
        # Kein X-Frame-Options-Fallback: Keycloak setzt fuer seine Seiten
        # eigene Werte und braucht fuer einzelne Seiten (Session-Iframes der
        # Account-Konsole) bewusst KEINEN - ein DENY von nginx wuerde sie
        # brechen.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options $hdr_xcto always;
        add_header Referrer-Policy $hdr_referrer always;
        # $request_uri (statt eines URI-Anteils in proxy_pass) leitet die
        # eingehende Pfad+Query-String 1:1 durch. Das ist hier bewusst so
        # gewaehlt, weil sich Location-Praefix ("/idp/") und Keycloaks
        # eigener KC_HTTP_RELATIVE_PATH ("/idp") decken - es muss also
        # nichts umgeschrieben werden. (Ein proxy_pass mit Variable UND
        # zusaetzlichem URI-Anteil, z.B. "$upstream/idp/", macht bei nginx
        # KEINE Location-Praefix-Ersetzung wie bei einem statischen
        # proxy_pass - das fuehrt sonst zu falsch zusammengesetzten Pfaden.)
        proxy_pass http://$keycloak_upstream$request_uri;
    }
}
