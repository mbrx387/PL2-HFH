# Reverse Proxy + TLS-Terminierung vor der FastAPI-App.
#
# HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Für den lokalen/Demo-Betrieb: selbstsigniertes Zertifikat
    # (siehe scripts/generate_dev_cert.sh). Auf dem Ubuntu-Server im
    # Produktivbetrieb wird dieser Pfad durch ein echtes Let's-Encrypt-
    # Zertifikat ersetzt (siehe README, Abschnitt HTTPS/Zertifikate).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    limit_req zone=general burst=20 nodelay;

    # Docker-interner Resolver + $upstream-Variablen statt statischer
    # Hostnamen in proxy_pass: nginx loest Container-Namen sonst NUR EINMAL
    # beim eigenen Start/Reload auf und cached das Ergebnis dauerhaft - wird
    # z.B. nur der "app"-Container neu gebaut/neu gestartet (neue interne
    # IP), zeigt nginx ohne dieses Muster weiter auf die alte, tote IP
    # (502), bis nginx selbst manuell neu geladen wird. Mit der Variable
    # wird pro Request neu aufgeloest. Zusaetzlicher Vorteil bei /idp/:
    # ohne aktives "sso"-Profil existiert der Container "keycloak" gar
    # nicht - ein statischer Hostname wuerde dann schon den Config-Test
    # (und damit den gesamten Reverse Proxy) zum Scheitern bringen.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $app_upstream app:8000;
        proxy_pass http://$app_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        set $app_upstream app:8000;
        proxy_pass http://$app_upstream/healthz;
        access_log off;
    }

    # Keycloak (SSO), nur relevant wenn "docker compose --profile sso"
    # gestartet wurde. Ueber KC_HTTP_RELATIVE_PATH=/idp erwartet Keycloak
    # selbst Requests unter genau diesem Pfad-Praefix.
    location /idp/ {
        set $keycloak_upstream keycloak:8080;
        # $request_uri (statt eines URI-Anteils in proxy_pass) leitet die
        # eingehende Pfad+Query-String 1:1 durch. Das ist hier bewusst so
        # gewaehlt, weil sich Location-Praefix ("/idp/") und Keycloaks
        # eigener KC_HTTP_RELATIVE_PATH ("/idp") decken - es muss also
        # nichts umgeschrieben werden. (Ein proxy_pass mit Variable UND
        # zusaetzlichem URI-Anteil, z.B. "$upstream/idp/", macht bei nginx
        # KEINE Location-Praefix-Ersetzung wie bei einem statischen
        # proxy_pass - das fuehrt sonst zu falsch zusammengesetzten Pfaden.)
        proxy_pass http://$keycloak_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
