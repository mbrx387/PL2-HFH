user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Keine nginx-Versionsnummer im "Server"-Header und auf Fehlerseiten.
    server_tokens off;

    # Formulare der App sind klein; explizit statt implizitem Default.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    # text/javascript: so liefert Starlette .js-Dateien aus (ohne diesen Typ
    # wurde main.js unkomprimiert ausgeliefert).
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Reduziert Angriffsfläche über simples Rate-Limiting pro IP.
    # Verhindert u.a., dass die /api/centers-Liste massenhaft abgegriffen
    # oder das mailto-Feature per Skript missbraucht wird.
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    # 429 "Too Many Requests" statt des Defaults 503 - unterscheidbar von
    # echten Ausfaellen (Logs, Monitoring, Browser-Konsole).
    limit_req_status 429;
    limit_req_log_level warn;

    # Basis-Sicherheitsheader nur setzen, wenn der Dienst dahinter keinen
    # eigenen schickt (leerer Wert = nginx laesst den Header weg). So tragen
    # auch von nginx selbst erzeugte Antworten (301, 404, 429, 502) die
    # Header, ohne die Werte der App (app/security.py) zu doppeln.
    map $upstream_http_x_content_type_options $hdr_xcto {
        ""      "nosniff";
        default "";
    }
    map $upstream_http_x_frame_options $hdr_xfo {
        ""      "DENY";
        default "";
    }
    map $upstream_http_referrer_policy $hdr_referrer {
        ""      "same-origin";
        default "";
    }

    # Statische Dateien: mit Versions-Parameter (?v=<image-tag>, gesetzt in
    # app/templates/index.html) ein Jahr cachen, ohne Parameter bei jedem
    # Aufruf beim Server nachfragen (ETag/Last-Modified -> 304).
    map $arg_v $static_cache_control {
        ""      "no-cache";
        default "public, max-age=31536000, immutable";
    }

    include /etc/nginx/conf.d/*.conf;
    # Aus nginx/templates/ gerendert (Hostname je Server, siehe
    # docker-compose.yml und nginx/templates/default.conf.template).
    include /etc/nginx/sites/*.conf;
}
