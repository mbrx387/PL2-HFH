name: Uptime & Zertifikat

# Taegliche Pruefung von aussen (Teil von #21 Monitoring). Ein fehlgeschlagener
# Lauf erzeugt die normale GitHub-Benachrichtigung an die Repo-Beobachter.
on:
  schedule:
    - cron: "17 6 * * *" # taeglich 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  # Repo-Variable PUBLIC_HOST ueberschreibt den Default (Settings -> Variables).
  HOST: ${{ vars.PUBLIC_HOST || 'projekthfh.tech' }}
  # Warnen, wenn das Zertifikat in weniger als so vielen Tagen ablaeuft.
  # certbot verlaengert 30 Tage vorher - bei < 21 Tagen hat die Verlaengerung
  # also mindestens 9 Tage lang nicht funktioniert.
  MIN_DAYS: "21"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Healthcheck
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 15 "https://${HOST}/healthz"; then exit 0; fi
            sleep 20
          done
          echo "::error::https://${HOST}/healthz nicht erreichbar"
          exit 1

      - name: Zertifikat-Laufzeit
        run: |
          end="$(echo | openssl s_client -connect "${HOST}:443" -servername "${HOST}" 2>/dev/null \
                 | openssl x509 -noout -enddate | cut -d= -f2)"
          days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "Zertifikat fuer ${HOST} gueltig bis ${end} (noch ${days} Tage)."
          if [ "$days" -lt "$MIN_DAYS" ]; then
            echo "::error::Zertifikat laeuft in ${days} Tagen ab - certbot-Verlaengerung pruefen (nginx/README.md)."
            exit 1
          fi
