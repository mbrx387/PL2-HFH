name: Uptime & Zertifikat

# Taegliche Pruefung von aussen (Teil von #21 Monitoring), fuer INT und PROD.
# Ein fehlgeschlagener Lauf erzeugt die normale GitHub-Benachrichtigung an die
# Repo-Beobachter.
on:
  schedule:
    - cron: "17 6 * * *" # taeglich 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  # Warnen, wenn das Zertifikat in weniger als so vielen Tagen ablaeuft.
  # certbot verlaengert 30 Tage vorher - bei < 21 Tagen hat die Verlaengerung
  # also mindestens 9 Tage lang nicht funktioniert.
  MIN_DAYS: "21"

jobs:
  check:
    name: check (${{ matrix.stage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Repo-Variablen (Settings -> Variables). PUBLIC_HOST_PROD leer =
          # HFH-Server noch nicht in Betrieb -> PROD wird uebersprungen.
          - stage: INT
            host: ${{ vars.PUBLIC_HOST || 'projekthfh.tech' }}
          - stage: PROD
            host: ${{ vars.PUBLIC_HOST_PROD }}
    env:
      HOST: ${{ matrix.host }}
    steps:
      - name: Healthcheck
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::${{ matrix.stage }}: kein Hostname gesetzt - uebersprungen."
            exit 0
          fi
          for i in 1 2 3; do
            if curl -fsS --max-time 15 "https://${HOST}/healthz"; then exit 0; fi
            sleep 20
          done
          echo "::error::${{ matrix.stage }}: https://${HOST}/healthz nicht erreichbar"
          exit 1

      - name: Zertifikat-Laufzeit
        if: env.HOST != ''
        run: |
          end="$(echo | openssl s_client -connect "${HOST}:443" -servername "${HOST}" 2>/dev/null \
                 | openssl x509 -noout -enddate | cut -d= -f2)"
          days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "${{ matrix.stage }}: Zertifikat fuer ${HOST} gueltig bis ${end} (noch ${days} Tage)."
          if [ "$days" -lt "$MIN_DAYS" ]; then
            echo "::error::${{ matrix.stage }}: Zertifikat laeuft in ${days} Tagen ab - certbot-Verlaengerung pruefen (nginx/README.md)."
            exit 1
          fi
