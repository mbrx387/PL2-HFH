name: GetDataFromAPI

on:
  push:
    branches: [main, ETL-Prozesse]
    paths:
      - "GetDataFromAPI/**"
      - "app/**"
      - "tests/**"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/GetDataFromAPI.yml"
  pull_request:
    paths:
      - "GetDataFromAPI/**"
      - "app/**"
      - "tests/**"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/GetDataFromAPI.yml"
  workflow_dispatch:
  schedule:
    # Weekly on Saturday at 02:00 UTC (03:00 CET / 04:00 CEST).
    - cron: "0 2 * * 6"

permissions:
  contents: read
  actions: read

concurrency:
  group: get-data-from-api
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r app/requirements.txt -r requirements-dev.txt -r GetDataFromAPI/requirements.txt
      - run: ruff check .
      - name: Run tests / Tests ausfuehren
        run: |
          mkdir -p build
          pytest -q --basetemp=build/pytest

  import:
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r GetDataFromAPI/requirements.txt
      - name: Restore last successful export / Letzten Export wiederherstellen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          previous="$(gh api "repos/$GH_REPO/actions/artifacts?per_page=100" | jq -r --arg branch "$GITHUB_REF_NAME" '[.artifacts[] | select(.expired == false and (.name | startswith("pflegestellen-")) and .workflow_run.head_branch == $branch)][0].workflow_run.id // empty')"
          if [ -n "$previous" ]; then
            gh run download "$previous" --name "pflegestellen-$previous" --dir build/GetDataFromAPI
          else
            echo 'First run / Erster Lauf: app CSV is the baseline.'
          fi
      - name: Extract, transform and validate / Extrahieren, transformieren und pruefen
        env:
          ZQP_API_URL: ${{ secrets.ZQP_API_URL }}
        run: python -m GetDataFromAPI
      - name: Excel, JSON and CSV / Excel, JSON und CSV
        uses: actions/upload-artifact@v7
        with:
          name: pflegestellen-${{ github.run_id }}
          path: |
            build/GetDataFromAPI/*.csv
            build/GetDataFromAPI/*.json
            build/GetDataFromAPI/*.xlsx
          if-no-files-found: error
          retention-days: 90
      - name: Stage CSV in db/temp / CSV in db/temp bereitstellen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python scripts/fetch_latest_getdatafromapi_artifact.py \
            --run-id "$GITHUB_RUN_ID"
      # Issue #85: Der Workflow legt die CSV nur noch auf dem Server ab (scp).
      # Pruefung gegen die DB (Sperrvermerk) und Import macht der Server-Cron
      # (scripts/import_latest_centers.sh), nicht mehr dieser Workflow.
      - name: Prepare database server / Datenbankserver vorbereiten
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /opt/pl2-hfh
            test -s db/import_centers.sql
            docker compose config --services | grep -Fxq app-db
            mkdir -p db/temp
      - name: Copy CSV to database server / CSV zum Datenbankserver kopieren
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: db/temp/pflegestellen.csv
          target: /opt/pl2-hfh/db/temp/
          overwrite: true
      - name: Failure summary / Fehlerzusammenfassung
        if: failure()
        run: |
          echo '## ETL failed / ETL fehlgeschlagen' >> "$GITHUB_STEP_SUMMARY"
          echo 'Existing app data is unchanged. The CSV is only staged on the database server; the actual import runs server-side via scripts/import_latest_centers.sh (see /var/log/pl2-hfh/import-centers.log).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Bestehende App-Daten bleiben erhalten. Die CSV wird nur auf dem Datenbankserver abgelegt; der eigentliche Import laeuft serverseitig per scripts/import_latest_centers.sh (Log: /var/log/pl2-hfh/import-centers.log). Fehlerhaften Schritt, Konfiguration und Quelle vor erneutem Start pruefen.' >> "$GITHUB_STEP_SUMMARY"
