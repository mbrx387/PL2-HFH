name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r app/requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  build-and-push:
    # Nur auf main bauen/deployen; PRs laufen ausschliesslich durch "test".
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p /opt/pl2-hfh
            cd /opt/pl2-hfh
            if [ ! -d .git ]; then
              # Ordner existiert ggf. schon (z.B. wegen .env) - "clone" in
              # ein bestehendes, nicht-leeres Verzeichnis scheitert, daher
              # per init+fetch+checkout statt "git clone" initialisieren.
              # checkout -f fasst nur GIT-TRACKED Dateien an, .env (ist
              # .gitignore't) bleibt unberührt.
              git init -b main
              git remote add origin https://github.com/${{ github.repository }}.git
            fi
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main
            # Pflichtvariablen der Server-.env pruefen, BEVOR docker compose
            # mit einer kryptischen Meldung abbricht. Platzhalter zaehlen als
            # fehlend. Zertifikate pruefen, weil nginx ohne sie nicht startet.
            if [ ! -f .env ]; then
              echo "::error::/opt/pl2-hfh/.env fehlt - aus .env.example anlegen."
              exit 1
            fi
            missing=""
            for key in SECRET_KEY APP_PUBLIC_URL ALLOWED_ORIGINS \
                       OIDC_ISSUER OIDC_CLIENT_ID OIDC_CLIENT_SECRET OIDC_ISSUER_INTERNAL \
                       KEYCLOAK_ADMIN_PASSWORD KEYCLOAK_DB_PASSWORD KC_HOSTNAME; do
              value="$(grep -E "^${key}=" .env | tail -n1 | cut -d= -f2-)"
              case "$value" in
                ""|change-me|*example.org*) missing="$missing $key" ;;
              esac
            done
            if [ -n "$missing" ]; then
              echo "::error::In /opt/pl2-hfh/.env fehlen oder sind Platzhalter:$missing"
              echo "Siehe .env.example und README.md, Abschnitt 8."
              exit 1
            fi
            for cert in nginx/certs/fullchain.pem nginx/certs/privkey.pem; do
              if [ ! -s "$cert" ]; then
                echo "::error::$cert fehlt - nginx startet ohne TLS-Zertifikat nicht."
                exit 1
              fi
            done
            # Exakten Build dieses Commits deployen (statt "latest"); der Tag
            # bleibt in .env stehen, damit spaetere manuelle `compose up`
            # dieselbe Version nutzen. Rollback = alten Tag eintragen.
            IMAGE_TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
            sed -i '/^IMAGE_TAG=/d' .env
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            # Compose-Konfiguration validieren (faengt z.B. Syntaxfehler ab).
            docker compose --profile sso config --quiet
            # Nur nötig, falls das GHCR-Package NICHT public ist:
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose --profile sso pull
            docker compose --profile sso up -d
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            for i in $(seq 1 12); do
              if curl -fsS -k https://localhost/healthz > /dev/null; then
                echo "Healthy."
                exit 0
              fi
              echo "Not ready yet, retry $i/12..."
              sleep 5
            done
            echo "Health check failed after 60s - dumping status/logs:"
            cd /opt/pl2-hfh
            docker compose ps
            docker compose logs --tail=50
            exit 1
