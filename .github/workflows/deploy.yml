name: Build & Deploy

# Ablauf (Details: docs/BETRIEB.md):
#   Pull Request : test -> Image sha-<PR-Commit> -> deploy-int (INT-Server)
#   Merge (main) : test -> Image sha-<main-Commit> -> deploy-int -> deploy-prod
#   Manuell      : "Run workflow" mit Commit von main -> nur deploy-prod
#                  (Rollback / erneuter Deploy, Image muss schon existieren)
# Merge-Sperre: Ruleset auf main verlangt den Check "deploy-int / deploy".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: Voller Commit-SHA von main, der auf PROD deployt wird
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/app

jobs:
  # Bricht ab, sobald ein Commit eine echte Umgebungsdatei (.env, .env.local,
  # prod.env, ...) hinzufuegt, aendert oder loescht. Der Deploy macht auf dem
  # Server "git reset --hard" - eine versionierte .env wuerde die Server-.env
  # (Secrets, Client-Secret, IMAGE_TAG) ueberschreiben bzw. loeschen und das
  # Deployment zerstoeren. Erlaubt ist nur die Vorlage .env.example.
  env-guard:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Keine .env-Dateien im Repository
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          is_env_file() {
            grep -E '(^|/)(\.env(\..+)?|[^/]+\.env)$' | grep -vE '(^|/)\.env\.example$' || true
          }

          # 1) Aktueller Stand: keine versionierte .env.
          tracked="$(git ls-files | is_env_file)"

          # 2) Alle Commits dieses Pushes/PRs: auch eine .env, die in einem
          #    Commit hinzugefuegt und im naechsten wieder entfernt wurde,
          #    liegt danach mit allen Secrets in der Historie.
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # Neuer Branch / unbekannter Vorgaenger: gegen main pruefen.
            base="$(git merge-base origin/main HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -n1)"
          fi
          touched="$(git log --format= --name-only "${base}..HEAD" | sort -u | is_env_file)"

          if [ -n "$tracked$touched" ]; then
            echo "::error::Umgebungsdateien duerfen nicht versioniert werden (nur .env.example ist erlaubt)."
            [ -n "$tracked" ] && printf 'Versioniert:\n%s\n' "$tracked"
            [ -n "$touched" ] && printf 'In diesen Commits geaendert:\n%s\n' "$touched"
            echo "Datei entfernen (git rm --cached <datei>) und enthaltene Secrets rotieren."
            exit 1
          fi
          echo "OK - keine .env-Dateien versioniert oder geaendert."

  test:
    needs: env-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r app/requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

      # nginx-Konfiguration mit genau dem Image pruefen, das auch der Server
      # nutzt - ein Tippfehler faellt so im PR auf, nicht erst beim Reload.
      # Das Template wird wie auf dem Server vom Image-Entrypoint gerendert,
      # einmal mit dem INT-Hostnamen und einmal mit einem PROD-artigen Namen.
      - name: nginx-Konfiguration pruefen (nginx -t)
        run: |
          ./scripts/generate_dev_cert.sh
          image="$(grep -E '^\s+image: nginx:' docker-compose.yml | awk '{print $2}')"
          for host in projekthfh.tech prod.example.de; do
            echo "== PUBLIC_HOST=$host"
            docker run --rm \
              -e PUBLIC_HOST="$host" \
              -e 'NGINX_ENVSUBST_FILTER=^PUBLIC_HOST$' \
              -e NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx \
              -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
              -v "$PWD/nginx/conf.d:/etc/nginx/conf.d:ro" \
              -v "$PWD/nginx/templates:/etc/nginx/templates:ro" \
              -v "$PWD/nginx/certs:/etc/nginx/certs:ro" \
              "$image" sh -c "/docker-entrypoint.sh nginx -t && grep -q 'server_name $host localhost;' /etc/nginx/sites/default.conf"
          done

  build-and-push:
    # main und PRs aus diesem Repo. PRs aus Forks bekommen keine Secrets und
    # duerfen nicht auf INT laufen - sie bleiben bei "test".
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Bei PRs den PR-Commit selbst bauen (nicht den Merge-Commit), damit
      # Image-Tag, Server-Checkout und getesteter Stand zusammenpassen.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # type=sha bei PRs aus dem PR-Commit statt aus dem Merge-Commit.
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # INT = jetziger Server (projekthfh.tech). Secrets SSH_HOST, SSH_USER,
  # SSH_PRIVATE_KEY (unveraendert). Bei PRs der PR-Commit, auf main der Merge.
  deploy-int:
    needs: build-and-push
    concurrency:
      group: deploy-int
      cancel-in-progress: false
    permissions:
      packages: read
    uses: ./.github/workflows/deploy-server.yml
    with:
      environment: INT
      suffix: ""
      sha: ${{ github.event.pull_request.head.sha || github.sha }}
      fetch_ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || 'main' }}
    secrets: inherit

  # PROD = HFH-Server. Secrets SSH_HOST_PROD, SSH_USER_PROD,
  # SSH_PRIVATE_KEY_PROD im Environment PROD (nur Branch main erlaubt).
  # Nach einem Merge erst, wenn INT mit demselben Commit gruen ist.
  # Eingeschaltet wird PROD durch die Repo-Variable PUBLIC_HOST_PROD - solange
  # sie fehlt (HFH-Server noch nicht eingerichtet), wird der Job uebersprungen.
  deploy-prod:
    needs: deploy-int
    if: >-
      !cancelled() && vars.PUBLIC_HOST_PROD != '' && (
        (github.event_name == 'push' && needs.deploy-int.result == 'success') ||
        github.event_name == 'workflow_dispatch')
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      packages: read
    uses: ./.github/workflows/deploy-server.yml
    with:
      environment: PROD
      suffix: _PROD
      sha: ${{ inputs.sha || github.sha }}
      fetch_ref: main
      require_on_main: true
    secrets: inherit
