# Eigene pytest-Konfiguration fuer die E2E-Tests. Wird bei `pytest e2e`
# automatisch verwendet (statt [tool.pytest.ini_options] in pyproject.toml);
# ein normales `pytest` ohne Argumente sammelt weiterhin nur tests/.
#
# Fehleranalyse: bei fehlgeschlagenen Tests landen Screenshot, Video und
# Trace unter test-results/<test>/ (Trace ansehen:
# `python -m playwright show-trace test-results/<test>/trace.zip`),
# der HTML-Report unter playwright-report/index.html.
[pytest]
addopts =
    --browser chromium
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing retain-on-failure
    --output test-results
    --html=playwright-report/index.html
    --self-contained-html
markers =
    auth: benoetigt Keycloak-Login (Phase 2, siehe README.md, Abschnitt 7)
