# Login-Theme "hfh" fuer den Pflegezentren-Finder.
# Erbt alles (Templates, Texte, Skripte) vom Keycloak-Standard-Theme
# keycloak.v2 und ueberschreibt nur Farben und Formen per CSS.
# Gestaltung angelehnt an frontend/index.html (PflegeKompass-Entwurf).
parent=keycloak.v2
import=common/keycloak

# styles.css stammt aus keycloak.v2 und muss mit aufgefuehrt werden, weil
# "styles" die Liste des Eltern-Themes ersetzt; hfh.css kommt danach und
# ueberschreibt gezielt.
styles=css/styles.css css/hfh.css

locales=de,en
